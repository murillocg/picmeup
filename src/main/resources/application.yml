spring:
  application:
    name: picmeup
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        # Lax, not Strict. The OAuth callback is a cross-site navigation — Cognito
        # redirects the browser back to us — and Strict withholds the cookie on
        # exactly that, so the session carrying the authorization request is missing
        # and sign-in fails with authorization_request_not_found. Lax still withholds
        # it on cross-site POSTs, and CSRF tokens cover state-changing requests.
        same-site: lax
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

management:
  endpoints:
    web:
      base-path: /actuator
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: http://localhost:5173
  admin:
    username: admin
    password: "{noop}admin123"
  pass:
    price: 65.00
  email:
    sender: ${EMAIL_SENDER:noreply@elitesportphotos.com}
    admin-recipients: ${EMAIL_ADMIN_RECIPIENTS:trent@elitesportphotos.com,murillo.cg@gmail.com}

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/picmeup
    username: picmeup
    password: picmeup
  jpa:
    show-sql: true

aws:
  region: us-east-1
  s3:
    bucket: picmeup-photos
    endpoint: http://localhost:4566
  rekognition:
    endpoint: http://localhost:4566
    confidence-threshold: 80.0

paypal:
  client-id: ${PAYPAL_CLIENT_ID:unused}
  client-secret: ${PAYPAL_CLIENT_SECRET:unused}
  base-url: https://api-m.sandbox.paypal.com

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/picmeup
    username: picmeup
    password: ${DB_PASSWORD}

aws:
  region: us-east-1
  s3:
    bucket: picmeup-photos-dev
  rekognition:
    confidence-threshold: 80.0

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  base-url: https://api-m.sandbox.paypal.com

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        provider:
          cognito:
            issuer-uri: ${COGNITO_ISSUER_URI}
        registration:
          cognito:
            client-id: ${COGNITO_CLIENT_ID}
            client-secret: ${COGNITO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,email,profile
            # Literal, not "{baseUrl}/...". CloudFront reaches the origin over plain
            # HTTP, so Spring sees an insecure request and would build this as http://,
            # which Cognito rejects — it matches the callback as an exact string. The
            # forwarded-proto header that would fix baseUrl does not survive CloudFront
            # (see below), and this app has exactly one production URL anyway.
            redirect-uri: "https://www.elitesportphotos.com/api/auth/callback/cognito"

# Honours X-Forwarded-Proto when something upstream sets it. Verified working when the
# header is sent directly to the origin — but CloudFront currently does not deliver it,
# so absolute URLs Spring builds itself are still http://. That is why redirect-uri above
# is literal rather than templated, and why the session cookie carries no Secure flag.
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Set explicitly rather than inferred. Spring sees a plain-HTTP request from
        # CloudFront, so request.isSecure() is false and the flag would never be
        # applied — even though viewers only ever reach this host over HTTPS.
        secure: true

aws:
  region: ${AWS_REGION:ap-southeast-2}
  s3:
    bucket: ${S3_BUCKET}
  rekognition:
    confidence-threshold: 85.0
    collection-prefix: ${REKOGNITION_COLLECTION_PREFIX:elitesportphotos}

lambda:
  callback-secret: ${LAMBDA_CALLBACK_SECRET:}

app:
  cookies:
    # Not inferred: behind CloudFront the origin call is plain HTTP, so
    # request.isSecure() is false even though viewers only reach us over HTTPS.
    secure: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
    # Treated as ADMIN on first sign-in even with no users row. Without at least one,
    # nobody can issue the first invite, because inviting requires already being an admin.
    bootstrap-emails: ${ADMIN_BOOTSTRAP_EMAILS:}

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  base-url: ${PAYPAL_BASE_URL:https://api-m.paypal.com}
